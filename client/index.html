<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GroupPad — Pick one rental, together</title>
    <meta name="description" content="One shared board for your group to browse vacation rentals, vote, see the real per-person cost, compare with AI, and lock in the place everyone's happy with." />
    <link rel="canonical" href="https://grouppad.goldhac.com/" />
    <meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15201E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- No-FOUC theme bootstrap: set the warm theme before first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gp_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Brand type: Bricolage Grotesque (display) + Hanken Grotesk (sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:opsz,wght@9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GroupPad" />
    <meta property="og:title" content="GroupPad — Pick one rental, together" />
    <meta property="og:description" content="One shared board for your group to browse rentals, vote, compare with AI, and lock in the winner." />
    <meta property="og:url" content="https://grouppad.goldhac.com/" />
    <meta property="og:image" content="https://grouppad.goldhac.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GroupPad — pick one vacation rental, together" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GroupPad — Pick one rental, together" />
    <meta name="twitter:description" content="One shared board for your group to browse rentals, vote, compare with AI, and lock in the winner." />
    <meta name="twitter:image" content="https://grouppad.goldhac.com/og.jpg" />
    <meta name="twitter:image:alt" content="GroupPad — pick one vacation rental, together" />

    <!-- Structured data: the product + the site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "GroupPad",
          "url": "https://grouppad.goldhac.com/",
          "applicationCategory": "TravelApplication",
          "operatingSystem": "Web",
          "description": "One shared board for your group to browse vacation rentals, vote, see the real per-person cost, compare with AI, and lock in one place to book together.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        },
        {
          "@type": "WebSite",
          "name": "GroupPad",
          "url": "https://grouppad.goldhac.com/",
          "publisher": { "@type": "Organization", "name": "GroupPad", "url": "https://grouppad.goldhac.com/" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

version: "2"
type: backend
tech_stack:
  - Node.js
  - Express
  - JavaScript
  - JSON file storage (per-trip data/trips/<id>/*.json)
  - Cookie sessions (gp_session)
  - Google Gemini (AI compare/insights)
  - Apify (listing search pipeline)
features:
  - name: Authentication & session
    description: Passwordless auth via magic link and Google OAuth; session cookie gp_session identifies the user. Public read of the current session, profile patch, logout.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/auth/me
        description: Return the current authenticated user (or null) for the session cookie.
        auth_required: false
        response_schema:
          "200": "{ user: { id, email, name, avatar } | null }"
      - method: POST
        path: /api/auth/request-link
        description: Request a passwordless magic-link email for the given address.
        auth_required: false
        request_schema:
          body:
            email: string
        response_schema:
          "200": "{ ok: true }"
          "400": Missing or invalid email
      - method: PATCH
        path: /api/auth/me
        description: Update the signed-in user's profile (name, avatar).
        auth_required: true
        request_schema:
          body:
            name: string
            avatar: string
        response_schema:
          "200": "{ user }"
          "401": Not authenticated
      - method: POST
        path: /api/auth/logout
        description: Clear the current session cookie.
        auth_required: false
        response_schema:
          "200": "{ ok: true }"
    depends_on: []
  - name: Trips
    description: Create/read/update/delete trips and membership. A trip board is publicly viewable by link; mutation and roster are organizer-gated.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/me/trips
        description: List trips the signed-in user owns or has joined.
        auth_required: true
        response_schema:
          "200": "{ trips: Trip[] }"
          "401": Not authenticated
      - method: POST
        path: /api/trips
        description: Create a new trip (name, destination, dates, budget, headcount).
        auth_required: true
        request_schema:
          body:
            name: string
            destination: string
            budget: number
        response_schema:
          "200": Trip
          "401": Not authenticated
      - method: GET
        path: /api/trips/:tripId
        description: Public read of a single trip (board is viewable by link).
        auth_required: false
        response_schema:
          "200": Trip
          "404": Trip not found
      - method: GET
        path: /api/trips/:tripId/members
        description: Organizer-only member roster (id, email, name, avatar).
        auth_required: true
        response_schema:
          "200": Member[]
          "403": Not the trip organizer
      - method: POST
        path: /api/trips/:tripId/join
        description: Join a trip as a member.
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "401": Not authenticated
      - method: DELETE
        path: /api/trips/:tripId
        description: Delete a trip (organizer only).
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
    depends_on:
      - Authentication & session
  - name: Listings (board)
    description: The ranked homes shown on the board. Public read; deletion is organizer-gated.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/listings
        description: List the trip's ranked homes (the board). Public. Returns an envelope, not a bare array.
        auth_required: false
        response_schema:
          "200": "{ trip: TripMeta, listings: Listing[] }"
          "404": Trip not found
      - method: GET
        path: /api/trips/:tripId/pipeline-listings
        description: Live/in-pipeline listings still being fetched.
        auth_required: false
        response_schema:
          "200": Listing[]
      - method: DELETE
        path: /api/trips/:tripId/listings/:id
        description: Remove a listing from the board (organizer only).
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
    depends_on:
      - Trips
  - name: Voting
    description: Group thumbs up/down on homes; a home rises into the shortlist at net +1. Read is public, casting a vote requires auth.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/votes
        description: Read the current vote tallies for the trip.
        auth_required: false
        response_schema:
          "200": "{ [listingId]: number }"
      - method: POST
        path: /api/trips/:tripId/votes
        description: Cast or change a vote on a listing.
        auth_required: true
        request_schema:
          body:
            listingId: string
            value: number
        response_schema:
          "200": "{ ok: true }"
          "401": Not authenticated
    depends_on:
      - Authentication & session
  - name: Community submissions
    description: Members submit their own found homes; the organizer can remove submissions.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/submitted
        description: List member-submitted homes. Public.
        auth_required: false
        response_schema:
          "200": Submission[]
      - method: POST
        path: /api/trips/:tripId/submit
        description: Submit a home (URL or details) to the board.
        auth_required: true
        request_schema:
          body:
            url: string
        response_schema:
          "200": Submission
          "401": Not authenticated
      - method: DELETE
        path: /api/trips/:tripId/submitted/:id
        description: Remove a submission (organizer only).
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
    depends_on:
      - Authentication & session
  - name: Personal favorites
    description: Each member's private saved homes (Saved tab).
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/favorites
        description: List the signed-in member's saved homes for this trip.
        auth_required: true
        response_schema:
          "200": "string[]"
          "401": Not authenticated
      - method: POST
        path: /api/trips/:tripId/favorites
        description: Toggle a home in the member's saved list.
        auth_required: true
        request_schema:
          body:
            listingId: string
        response_schema:
          "200": "{ favorites: string[] }"
          "401": Not authenticated
    depends_on:
      - Authentication & session
  - name: Group criteria (caveats)
    description: Members request must-haves; the organizer approves them, and only approved criteria feed Scout's ranking. Approving/removing stales the cached analysis.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/caveats
        description: List the trip's criteria (pending + approved). Public read.
        auth_required: false
        response_schema:
          "200": Caveat[]
      - method: POST
        path: /api/trips/:tripId/caveats
        description: Submit a criterion request (sits pending until approved). Returns the full updated criteria array.
        auth_required: true
        request_schema:
          body:
            text: string
        response_schema:
          "200": "Caveat[]"
          "401": Not authenticated
      - method: POST
        path: /api/trips/:tripId/caveats/:id/approve
        description: Approve a pending criterion (organizer only); stales cached insights.
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
      - method: DELETE
        path: /api/trips/:tripId/caveats/:id
        description: Remove a criterion (organizer only); stales cached insights if it was approved.
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
    depends_on:
      - Authentication & session
  - name: Scout AI compare & insights
    description: AI (Scout) ranks the shortlist or runs a 1v1/multi compare weighing budget, distance and approved criteria; insights are cached and stale-able.
    files:
      - server.js
    endpoints:
      - method: POST
        path: /api/trips/:tripId/compare-listings
        description: Run a Scout comparison/ranking over selected homes.
        auth_required: false
        request_schema:
          body:
            listingIds: "string[]"
        response_schema:
          "200": "{ verdict, table }"
      - method: GET
        path: /api/trips/:tripId/insights
        description: Read the cached Scout insights (may be flagged stale).
        auth_required: false
        response_schema:
          "200": "{ ...insights, stale?: boolean }"
    depends_on:
      - Group criteria (caveats)
  - name: Decision lock
    description: Final-vote leaderboard; the organizer locks the official pick.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/final
        description: Read final-vote tallies / current decision.
        auth_required: false
        response_schema:
          "200": "{ tallies, decision }"
      - method: POST
        path: /api/trips/:tripId/final-vote
        description: Cast a final vote for the official pick.
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "401": Not authenticated
      - method: POST
        path: /api/trips/:tripId/decision
        description: Lock the official pick (organizer only).
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
    depends_on:
      - Authentication & session
  - name: Reviews & tours
    description: Per-listing reviews and AI-generated tour blurbs.
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/trips/:tripId/reviews
        description: Read fetched reviews for the trip's listings. Public.
        auth_required: false
        response_schema:
          "200": "{ [listingId]: Review[] }"
      - method: GET
        path: /api/trips/:tripId/tours
        description: Read generated tour blurbs for listings. Public.
        auth_required: false
        response_schema:
          "200": "{ [listingId]: Tour }"
    depends_on: []
  - name: Listing search
    description: Owner-triggered listing search/refresh with rate-limiting and status polling.
    files:
      - server.js
    endpoints:
      - method: POST
        path: /api/trips/:tripId/refresh
        description: Re-run the listing search (organizer only, rate-limited).
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not the trip organizer
          "429": Rate limited
      - method: GET
        path: /api/trips/:tripId/search-status
        description: Poll the current search status. Public.
        auth_required: false
        response_schema:
          "200": "{ status }"
      - method: GET
        path: /api/trips/:tripId/pulse
        description: Lightweight activity pulse for the trip. Public.
        auth_required: false
        response_schema:
          "200": "{ pulse }"
    depends_on:
      - Authentication & session
  - name: Admin
    description: Platform admin endpoints gated by super-admin session or admin key (requireAdmin).
    files:
      - server.js
    endpoints:
      - method: GET
        path: /api/admin/verify
        description: Verify admin credentials.
        auth_required: true
        response_schema:
          "200": "{ ok: true }"
          "403": Not admin
      - method: GET
        path: /api/admin/usage
        description: Platform usage meters.
        auth_required: true
        response_schema:
          "200": "{ usage }"
          "403": Not admin
    depends_on:
      - Authentication & session
known_limitations:
  - issue: Authentication is passwordless (magic-link / Google OAuth) — there is no username+password endpoint, so a test client must present a valid gp_session cookie to exercise auth-gated routes.
    location: server.js
    impact: Without a session cookie only public GET endpoints and public reads are reachable; auth/organizer routes return 401/403.
  - issue: Persistence is per-trip JSON files rather than a database; there is no transactional isolation.
    location: server.js (data/trips/<id>/*.json)
    impact: Heavy concurrent writes to the same trip rely on atomic file writes; no row-level locking.
  - issue: Many handlers are data-dependent on a seeded trip (la-birthday-2026).
    location: server.js
    impact: Endpoints should be exercised against tripId=la-birthday-2026 for populated, realistic data.
